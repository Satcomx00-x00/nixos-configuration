# ========================================
# hyprlock — screen locker configuration
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
#
# Font requirement: "JetBrainsMono Nerd Font" must be installed.
# It is included via fonts.packages in hosts/default/configuration.nix
# (nerd-fonts.jetbrains-mono).
# ========================================

general {
    # Disable the grace period (no unlock without password after lock)
    grace = 0
    hide_cursor = true
}

# ---------- Background ----------
background {
    monitor =
    # Take a blurred screenshot of the current screen as the lock background
    path = screenshot
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8917
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ---------- Clock ----------
label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    color = rgba(cdd6f4ee)
    position = 0, 160
    halign = center
    valign = center
}

# ---------- Date ----------
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    color = rgba(a6adc8ee)
    position = 0, 90
    halign = center
    valign = center
}

# ---------- User ----------
label {
    monitor =
    text = $USER
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    color = rgba(a6adc8ee)
    position = 0, -60
    halign = center
    valign = center
}

# ---------- Password input ----------
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(cba6f7)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 12
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(fab387)
    position = 0, -140
    halign = center
    valign = center
}

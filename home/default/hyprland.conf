# ========================================
# Hyprland Configuration
# NVIDIA-ready setup following upstream wiki
# https://wiki.hypr.land/Nix/Hyprland-on-NixOS/
# https://wiki.hypr.land/Nvidia/
# ========================================

# ---------- Monitor ----------
# Auto-detect monitor. Adjust for multi-monitor setups:
#   monitor = DP-1, 2560x1440@144, 0x0, 1
monitor = , preferred, auto, 1

# ---------- Common Variables ----------
$terminal    = kitty
$fileManager = nautilus
$launcher    = rofi -show drun
$browser     = firefox
$locker      = hyprlock

# ---------- Autostart ----------
exec-once = waybar &
exec-once = dunst &
exec-once = swww-daemon &
exec-once = nm-applet --indicator &
exec-once = wlsunset -t 4000 -T 6500 &
exec-once = hypridle &
# Feed clipboard history into cliphist (text and images)
exec-once = wl-paste --type text  --watch cliphist store &
exec-once = wl-paste --type image --watch cliphist store &

# ---------- Environment (NVIDIA) ----------
# These mirror the session variables set by modules/nvidia.nix and ensure
# Hyprland itself — and every child process — inherits the right values.
# See https://wiki.hypr.land/Nvidia/
env = LIBVA_DRIVER_NAME, nvidia
env = __GLX_VENDOR_LIBRARY_NAME, nvidia
# GBM_BACKEND=nvidia-drm improves Wayland buffer handling on most NVIDIA cards.
# Remove this line if you experience crashes with specific applications.
env = GBM_BACKEND, nvidia-drm
env = NVD_BACKEND, direct
env = MOZ_ENABLE_WAYLAND, 1
env = NIXOS_OZONE_WL, 1
env = ELECTRON_OZONE_PLATFORM_HINT, auto
env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORMTHEME, qt6ct

# ---------- Cursor (NVIDIA) ----------
# Disable hardware cursors — required on most NVIDIA setups to prevent
# the cursor from disappearing or rendering incorrectly.
cursor {
    no_hardware_cursors = true
}

# ---------- Input ----------
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# ---------- General ----------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(585b70aa)
    layout = dwindle
    allow_tearing = false
}

# ---------- Decoration ----------
decoration {
    rounding = 8

    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 8
        render_power = 2
        color = rgba(1a1a2eee)
    }
}

# ---------- Animations ----------
animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = windows, 1, 5, ease
    animation = windowsOut, 1, 5, ease, popin 80%
    animation = fade, 1, 4, ease
    animation = workspaces, 1, 4, ease
}

# ---------- Layout ----------
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    # Allow Hyprland to be queried / controlled via IPC (hyprctl)
    enable_swallow = true
    swallow_regex = ^(kitty)$
}

# ---------- Key Bindings ----------
$mod = SUPER

# Applications
bind = $mod, RETURN, exec, $terminal
bind = $mod, E, exec, $fileManager
bind = $mod, SPACE, exec, $launcher
bind = $mod, B, exec, $browser

# Screen lock (Super + Shift + L to avoid conflict with vim-style focus keys)
bind = $mod SHIFT, L, exec, $locker

# Logout menu
bind = $mod SHIFT, M, exec, wlogout

# Clipboard history (cliphist → rofi → wl-copy)
bind = $mod, C, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Color picker (copies hex value to clipboard)
bind = $mod, P, exec, hyprpicker -a

# Window management
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, F, fullscreen
bind = $mod, V, togglefloating
bind = $mod, T, togglesplit

# Pseudo-tiling
bind = $mod, Y, pseudo

# Special workspace (scratchpad)
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# Move focus (arrow keys + vim keys)
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Resize active window with keyboard
binde = $mod ALT, right, resizeactive,  30  0
binde = $mod ALT, left,  resizeactive, -30  0
binde = $mod ALT, up,    resizeactive,   0 -30
binde = $mod ALT, down,  resizeactive,   0  30

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Move / resize with mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshot
bind = , Print,       exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print,  exec, grim - | wl-copy

# Volume
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Brightness
binde = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# ---------- Window Rules ----------
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = float, class:pavucontrol
windowrulev2 = float, class:nm-connection-editor
windowrulev2 = float, class:wlogout
windowrulev2 = float, title:Open File
windowrulev2 = float, title:Save File
windowrulev2 = float, title:File Upload
# Treat the hyprlock window as a no-focus overlay
windowrulev2 = noanim, class:hyprlock

# ========================================
# hypridle — idle management configuration
# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# ========================================

general {
    # Command to run when the session is locked (ensures only one lock instance)
    lock_cmd = pidof hyprlock || hyprlock
    # Lock before the system suspends
    before_sleep_cmd = loginctl lock-session
    # Turn the display back on after waking from sleep
    after_sleep_cmd = hyprctl dispatch dpms on
    # Ignore dbus inhibit signals (e.g., from media players) when set to false
    ignore_dbus_inhibit = false
}

# ---------- Dim screen after 4 minutes ----------
# Reduce brightness to ~10% (near-off) as a visual warning before locking.
# Adjust the value to taste; 'brightnessctl -r' restores the previous level.
listener {
    timeout = 240
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# ---------- Lock screen after 5 minutes ----------
listener {
    timeout = 300
    on-timeout = loginctl lock-session
    on-resume  = hyprctl dispatch dpms on
}

# ---------- Turn off display after 8 minutes ----------
listener {
    timeout = 480
    on-timeout = hyprctl dispatch dpms off
    on-resume  = hyprctl dispatch dpms on
}

# ---------- Suspend after 30 minutes ----------
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
